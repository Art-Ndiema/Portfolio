<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - Grace Wambui</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <canvas id="successCanvas"></canvas>
    
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="success-title">Message Sent!</h1>
        <p class="success-message">Thank you for reaching out. I've received your message and will get back to you as soon as possible.</p>
        <a href="/" class="return-button">Return to Homepage</a>
    </div>
    
    <script src="success.js"></script>
</body>
</html>
